version: 2
project_name: skool-pp-cli
changelog:
  use: github
builds:
  - id: skool-pp-cli
    main: ./cmd/skool-pp-cli
    binary: skool-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/zm2231/skool-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: skool-pp-mcp
    main: ./cmd/skool-pp-mcp
    binary: skool-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - SKILL.md
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
